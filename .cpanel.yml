---
deployment:
  tasks:
    - export DEPLOYPATH=${HOME}/public_html/
    - /bin/mkdir -p "${DEPLOYPATH}" "${DEPLOYPATH}storage/logs" "${DEPLOYPATH}public/uploads/logos"
    - rsync -a --exclude='.git' --exclude='.cpanel.yml' --exclude='.env' --exclude='.env.*' --exclude='node_modules' --exclude='dist' --exclude='storage/install.lock' --exclude='storage/cf_turn_cache.json' --exclude='storage/logs/*' --exclude='storage/*.sqlite*' --exclude='public/uploads/logos/*' --exclude='*.sqlite*' ./ "${DEPLOYPATH}"
    - /bin/cp -f storage/.htaccess "${DEPLOYPATH}storage/.htaccess"
    - /bin/cp -f public/uploads/logos/.htaccess "${DEPLOYPATH}public/uploads/logos/.htaccess"
    - if [ -f "${DEPLOYPATH}storage/install.lock" ]; then /bin/rm -f "${DEPLOYPATH}install.php"; fi
    - /bin/chmod 755 "${DEPLOYPATH}storage" "${DEPLOYPATH}storage/logs" "${DEPLOYPATH}public/uploads/logos"
